[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clavagen"
version = "1.0.0"
description = "CLAVAGEN: ACMG/AMP variant classification for patients and families, from DNA, protein or Sanger sequences"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
fast = ["biopython>=1.80"]
test = ["pytest"]

[project.scripts]
clavagen = "clavagen.cli:main"
acmg-varcall = "clavagen.cli:main"   # old name, kept as an alias

[tool.setuptools]
packages = ["clavagen", "acmg_varcall"]
